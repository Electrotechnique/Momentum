; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = Momentum

[env:teensymm]
platform = teensy
board = teensymm
framework = arduino
; AUDIO_BLOCK_SAMPLES=64 halves the audio block (128 is the Audio library default):
; notes start up to ~1.5ms after they arrive instead of ~2.9ms, for a little more CPU.
; It must apply to the Teensy core and all libraries, so it is set here. (In the Arduino IDE
; it has to be changed in the Teensy core's AudioStream.h.) Remove it to go back to 128.
build_flags = -D USB_MIDI_AUDIO_SERIAL -D ARDUINOJSON_ENABLE_PROGMEM=0 -D AUDIO_BLOCK_SAMPLES=64
lib_deps = 
	rlogiacco/CircularBuffer@^1.3.3
	adafruit/Adafruit GFX Library@^1.10.7
	ftrias/TeensyThreads@^1.0.1
	adafruit/Adafruit BusIO@^1.7.3
	kurte/ILI9341_t3n@0.0.0-alpha+sha.f1bfb81825
	sukkopera/RokkitHash@0.0.0-alpha+sha.20151212
	janelia-arduino/Array@^1.2.1
	luni64/TeensyTimerTool@^1.2.0
	bblanchon/ArduinoJson@6.19.4
